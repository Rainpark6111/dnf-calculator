<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>던파 종말의 계시 계산기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            
            /* 배경 이미지 및 포토샵 블렌딩 모드 설정 */
            background-image: url('./bg.png'); /* GitHub Pages 호환용 상대 경로 */
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; /* 화면을 가득 채움 (비율 유지를 원하면 contain) */
            background-attachment: fixed;
            background-blend-mode: overlay; /* 오버레이 블렌딩 모드 (screen, soft-light 변경 가능) */

            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .calculator-card {
            background-color: #2b2b3d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 380px;
            position: relative; /* 버튼 정렬을 위한 위치 기준선 */
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h2 {
            margin: 0;
            color: #f5e0dc;
            font-size: 20px;
        }
        .link-buttons {
            display: flex;
            gap: 6px;
        }
        .link-btn {
            background-color: #181825;
            color: #cba6f7;
            border: 1px solid #45475a;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .link-btn:hover {
            background-color: #cba6f7;
            color: #181825;
            border-color: #cba6f7;
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #bac2de;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background-color: #181825;
            color: #cdd6f4;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #cba6f7;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
            background-color: #181825;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #45475a;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #cdd6f4;
        }
        .checkbox-item input[type="checkbox"] {
            accent-color: #cba6f7;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .result-box {
            margin-top: 24px;
            padding: 15px;
            background-color: #181825;
            border-radius: 6px;
            border-left: 4px solid #cba6f7;
        }
        .result-item {
            margin: 8px 0;
            font-size: 14px;
        }
        .highlight {
            color: #f9e2af;
            font-weight: bold;
        }
        .alert {
            color: #f38ba8;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header-container">
        <h2>종말의 계시 계산기</h2>
        <div class="link-buttons">
            <a href="https://dundam.xyz/search?server=all&name=%EB%A0%88%EC%9D%B8%EB%B0%95" target="_blank" class="link-btn">던담</a>
            <a href="https://dfmax.xyz/jobs" target="_blank" class="link-btn">던파맥스</a>
        </div>
    </div>
    
    <div class="input-group">
        <label for="fatigue">현재 피로도</label>
        <input type="text" id="fatigue" placeholder="" oninput="calculate()" onkeydown="handleEnter(event, this)" onblur="evaluateInput(this)">
    </div>
    
    <div class="input-group">
        <label for="revelations">보유 종말의 계시</label>
        <input type="text" id="revelations" placeholder="" oninput="calculate()" onkeydown="handleEnter(event, this)" onblur="evaluateInput(this)">
    </div>

    <div class="input-group">
        <label for="eventRevelations">[Event]종말의 계시</label>
        <input type="text" id="eventRevelations" placeholder="" oninput="calculate()" onkeydown="handleEnter(event, this)" onblur="evaluateInput(this)">
    </div>

    <div class="input-group">
        <label for="tickets">보유 입장권</label>
        <input type="text" id="tickets" placeholder="" oninput="calculate()" onkeydown="handleEnter(event, this)" onblur="evaluateInput(this)">
    </div>

    <!-- 할인 옵션 체크박스 -->
    <div class="checkbox-group">
        <label class="checkbox-item">
            <input type="checkbox" id="battlePass" onchange="calculate()"> 아라드 패스 (-5개)
        </label>
        <label class="checkbox-item">
            <input type="checkbox" id="pcRoom" onchange="calculate()"> PC방 (-5개)
        </label>
    </div>

    <!-- 결과 박스 -->
    <div class="result-box" id="resultBox">
        <div class="result-item">1판당 소모 계시: <span class="highlight" id="costPerRun">49</span>개</div>
        <div class="result-item">총 보유 종말의 계시: <span class="highlight" id="totalRevSum">0</span>개</div>
        <div class="result-item">피로도 기준 최대: <span class="highlight" id="fatigueRuns">0</span>판</div>
        <div class="result-item">현재 입장 가능: <span class="highlight" id="actualRuns">0</span>판</div>
        <div class="result-item" id="missingInfo">피로도를 입력해주세요.</div>
    </div>
</div>

<script>
// 수식을 안전하게 계산하는 함수
function parseMath(expression) {
    if (!expression) return 0;
    
    const sanitized = expression.replace(/\s+/g, '');
    if (!/^[0-9+\-*/.]*$/.test(sanitized)) return 0;

    try {
        const result = new Function(`return ${sanitized}`)();
        return isNaN(result) || !isFinite(result) ? 0 : Math.floor(result);
    } catch (e) {
        return 0;
    }
}

// 입력창 내의 수식을 계산 결과값으로 치환하는 함수
function evaluateInput(inputEl) {
    const val = inputEl.value.trim();
    if (!val) return;

    if (/[+\-*/]/.test(val)) {
        const calculatedVal = parseMath(val);
        inputEl.value = calculatedVal;
        calculate();
    }
}

// 엔터 키 입력 시 포커스 해제
function handleEnter(event, inputEl) {
    if (event.key === 'Enter') {
        inputEl.blur();
    }
}

function calculate() {
    const fatigueInput = document.getElementById('fatigue').value.trim();
    const ticketsInput = document.getElementById('tickets').value.trim();
    const revInput = document.getElementById('revelations').value.trim();
    const eventRevInput = document.getElementById('eventRevelations').value.trim();
    
    const isBattlePass = document.getElementById('battlePass').checked;
    const isPcRoom = document.getElementById('pcRoom').checked;

    // 할인율 계산
    let revCostPerRun = 49;
    if (isBattlePass) revCostPerRun -= 5;
    if (isPcRoom) revCostPerRun -= 5;

    // 수식 문자열 계산
    const fatigue = parseMath(fatigueInput);
    const tickets = parseMath(ticketsInput);
    const revelations = parseMath(revInput);
    const eventRevelations = parseMath(eventRevInput);

    // 총 보유 종말의 계시 합산
    const totalRevelations = revelations + eventRevelations;

    // 피로도로 돌 수 있는 총 횟수
    const maxRunsByFatigue = fatigue > 0 ? Math.ceil(fatigue / 8) : 0;
    
    // 입장권 사용 가능 판 수
    const ticketRuns = Math.min(maxRunsByFatigue, tickets);
    
    // 남은 필요 판 수
    const remainingRunsNeeded = maxRunsByFatigue - ticketRuns;
    
    // 계시 소모 판 수
    const maxRunsByRev = Math.floor(totalRevelations / revCostPerRun);
    const revRuns = Math.min(remainingRunsNeeded, maxRunsByRev);
    
    // 실제 입장 가능 횟수
    const actualRuns = ticketRuns + revRuns;
    
    // 부족한 계시 계산
    const totalRevNeeded = remainingRunsNeeded * revCostPerRun;
    const missingRev = Math.max(0, totalRevNeeded - totalRevelations);

    // UI 업데이트
    document.getElementById('costPerRun').innerText = revCostPerRun;
    document.getElementById('totalRevSum').innerText = totalRevelations;
    document.getElementById('fatigueRuns').innerText = maxRunsByFatigue;
    document.getElementById('actualRuns').innerText = actualRuns;
    
    const missingInfoEl = document.getElementById('missingInfo');
    if (missingRev > 0) {
        missingInfoEl.innerHTML = `부족한 종말의 계시: <span class="alert">${missingRev}개</span>`;
    } else if (maxRunsByFatigue > 0) {
        missingInfoEl.innerHTML = `<span class="highlight">피로도를 모두 소진할 수 있습니다!</span>`;
    } else {
        missingInfoEl.innerHTML = `피로도를 입력해주세요.`;
    }
}

// 초기 로드 시 1회 계산 수행
calculate();
</script>

</body>
</html>
