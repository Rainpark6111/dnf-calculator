<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>던파 종말의 계시 계산기</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            
            /* 배경 이미지 및 포토샵 블렌딩 모드 설정 */
            background-image: url('./bg.png'); /* GitHub Pages 호환용 상대 경로 */
            background-repeat: no-repeat;
            background-position: center;
            background-size: 75%;
            background-attachment: fixed;
            background-blend-mode: overlay; /* 오버레이 블렌딩 모드 (screen, soft-light 변경 가능) */

            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .calculator-card {
            background-color: #2b2b3d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 380px;
            position: relative; /* 버튼 정렬을 위한 위치 기준선 */
        }
        .header-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            text-align: center;
        }
        h2 {
            margin: 0;
            color: #f5e0dc;
            font-size: 20px;
            text-align: center;
        }
        .link-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }
        .input-row .input-group {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }
        .link-btn {
            background-color: #181825;
            color: #cba6f7;
            border: 1px solid #45475a;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .link-btn:hover {
            background-color: #cba6f7;
            color: #181825;
            border-color: #cba6f7;
        }
        .input-group {
            margin-bottom: 13px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #bac2de;
        }
        label {
            display: flex;
            align-items: center;
            gap: 5px;
            line-height: 1.2;
        }
        .label-icon {
            width: 1.4em;   /* 글자 크기에 맞춘 정사각형 (원본 37x37) */
            height: 1.4em;
            flex-shrink: 0;
            object-fit: contain;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background-color: #181825;
            color: #cdd6f4;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #cba6f7;
        }
        .note {
            margin: 0 0 14px;
            font-size: 12px;
            line-height: 1.5;
            color: #9399b2;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
            background-color: #181825;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #45475a;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #cdd6f4;
        }
        .checkbox-item input[type="checkbox"] {
            accent-color: #cba6f7;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .result-box {
            margin-top: 24px;
            padding: 10px;
            background-color: #181825;
            border-radius: 6px;
            border-left: 4px solid #cba6f7;
        }
        .result-item {
            margin: 8px 0;
            font-size: 14px;
        }
        .highlight {
            color: #f9e2af;
            font-weight: bold;
        }
        .alert {
            color: #f38ba8;
            font-weight: bold;
        }

        /* ===== 사용 계획 ===== */
        .plan-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #45475a;
        }
        .plan-title {
            font-size: 14px;
            font-weight: bold;
            color: #cba6f7;
            margin-bottom: 8px;
        }
        .plan-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .plan-list li {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 14px;
            padding: 4px 0;
        }
        .plan-empty {
            font-size: 14px;
            color: #9399b2;
        }
        .plan-after {
            margin-top: 8px;
            font-size: 13px;
            color: #bac2de;
        }
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
        .use-btn, .undo-btn {
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            padding: 11px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .use-btn {
            flex: 1;
            background-color: #cba6f7;
            color: #181825;
            border: 1px solid #cba6f7;
        }
        .use-btn:hover:not(:disabled) {
            background-color: #b48ef0;
        }
        .undo-btn {
            background-color: #181825;
            color: #cba6f7;
            border: 1px solid #45475a;
        }
        .undo-btn:hover:not(:disabled) {
            border-color: #cba6f7;
        }
        .use-btn:disabled, .undo-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== 반응형 ===== */
        body {
            min-height: 100vh;
            min-height: 100dvh; /* 모바일 주소창 높이 변화 대응 */
            padding-left: 16px;
            padding-right: 16px;
            -webkit-text-size-adjust: 100%;
        }
        .calculator-card {
            max-width: 420px;
        }
        .checkbox-group {
            flex-wrap: wrap;
        }
        .link-btn {
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                background-size: cover;
                background-attachment: scroll; /* iOS는 fixed 미지원 */
            }
            .calculator-card {
                padding: 20px 16px;
                max-width: 100%;
            }
            .header-container {
                flex-wrap: wrap;
                gap: 10px;
                margin-bottom: 18px;
            }
            h2 {
                font-size: 18px;
            }
            .link-btn {
                padding: 8px 12px; /* 터치하기 쉬운 크기 */
            }
            .checkbox-group {
                flex-direction: column;
                gap: 12px;
            }
            .checkbox-item {
                font-size: 15px;
            }
            .checkbox-item input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }
            input[type="text"] {
                padding: 12px; /* 16px 폰트 유지 → iOS 자동 확대 방지 */
            }
            .result-item, .plan-list li {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div class="calculator-card">

            <a href="https://dundam.xyz/search?server=all&name=%EB%A0%88%EC%9D%B8%EB%B0%95" target="_blank" class="link-btn">던담</a>

    <div class="input-row">

    <div class="input-row">

        </div>
        <div class="input-group">
            <label for="box1000"><img class="label-icon" src="./1000box.png" alt="">종말의 계시 1000개 상자</label>

    <div class="input-row">

        <div class="input-group">
            <label for="orb500"><img class="label-icon" src="./orb.png" alt="">종말의 계시 500개 구슬</label>
            <input type="text" id="orb500" placeholder="" oninput="calculate()" onkeydown="handleEnter(event, this)" onblur="evaluateInput(this)">

    <p class="note">※ 현재 피로도와 보유 종말의 계시는 캐릭터마다 달라 저장되지 않습니다. 그 외 창고 수량은 입력하면 자동 저장됩니다.</p>

    <!-- 할인 옵션 체크박스 -->
    <div class="checkbox-group">
        <label class="checkbox-item">
            <input type="checkbox" id="battlePass" onchange="calculate()"> 아라드 패스 (-5개)
        </label>

    <!-- 결과 박스 -->

        <div class="result-item">피로도 기준 최대: <span class="highlight" id="fatigueRuns">0</span>판</div>
        <div class="result-item">현재 입장 가능: <span class="highlight" id="actualRuns">0</span>판</div>

            <button type="button" class="use-btn" id="useBtn" onclick="useResources()" disabled>사용</button>

<script>
// 수식을 안전하게 계산하는 함수
function parseMath(expression) {
    if (!expression) return 0;
    
    const sanitized = expression.replace(/\s+/g, '');
    if (!/^[0-9+\-*/.]*$/.test(sanitized)) return 0;

    try {
        const result = new Function(`return ${sanitized}`)();
        return isNaN(result) || !isFinite(result) ? 0 : Math.floor(result);
    } catch (e) {
        return 0;
    }
}

// 입력창 내의 수식을 계산 결과값으로 치환하는 함수
function evaluateInput(inputEl) {
    const val = inputEl.value.trim();
    if (!val) return;

    if (/[+\-*/]/.test(val)) {
        const calculatedVal = parseMath(val);
        inputEl.value = calculatedVal;
        calculate();
    }
}

// 엔터 키 입력 시 포커스 해제
function handleEnter(event, inputEl) {
    if (event.key === 'Enter') {
        inputEl.blur();
    }
}

// 상자/구슬 종류 (큰 개수 순서 = 사용 우선순위)
const BOX_TYPES = [
    { id: 'box1000', amount: 1000, name: '1000개 상자' },
    { id: 'orb500',  amount: 500,  name: '500개 구슬' },
    { id: 'box90',   amount: 90,   name: '90개 상자' },
    { id: 'box40',   amount: 40,   name: '40개 상자' },
    { id: 'box30',   amount: 30,   name: '30개 상자' },
    { id: 'box4',    amount: 4,    name: '4개 상자' },
    { id: 'box2',    amount: 2,    name: '2개 상자' },
    { id: 'c2box',   amount: 2,    name: '[C]2개 상자' } // 같은 2개 상자 중 일반 상자를 먼저 사용
];

// 저장 대상: 계정 귀속(창고) 수량. 피로도와 보유 종말의 계시는 저장하지 않음
const SAVED_IDS = ['eventRevelations', 'eventStock', 'tickets', ...BOX_TYPES.map(b => b.id)];
const ALL_IDS = ['fatigue', 'revelations', ...SAVED_IDS];
const STORAGE_KEY = 'dnfRevelationStock';

const fmt = n => n.toLocaleString('ko-KR');
const val = id => parseMath(document.getElementById(id).value.trim());

let lastPlan = null;
let undoSnapshot = null;

function saveStock() {
    try {
        const data = {};
        SAVED_IDS.forEach(id => { data[id] = document.getElementById(id).value; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* 저장 불가 환경이면 무시 */ }
}

function loadStock() {
    try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        SAVED_IDS.forEach(id => {
            if (typeof data[id] === 'string') document.getElementById(id).value = data[id];
        });
    } catch (e) { /* 손상된 데이터면 무시 */ }
}

// 우선순위: 보유 계시 > 입장권 > [Event] 계시 > 큰 상자/구슬 순 > 계정귀속 계시
function computePlan() {
    const fatigue = val('fatigue');
    const rev = val('revelations');
    const eventRev = val('eventRevelations');
    const eventStock = val('eventStock');
    const tickets = val('tickets');
    const boxCounts = {};
    BOX_TYPES.forEach(b => { boxCounts[b.id] = val(b.id); });

    let cost = 49;
    if (document.getElementById('battlePass').checked) cost -= 5;
    if (document.getElementById('pcRoom').checked) cost -= 5;

    const boxTotal = BOX_TYPES.reduce((s, b) => s + boxCounts[b.id] * b.amount, 0);
    const totalRev = rev + eventRev + eventStock + boxTotal;

    const fatigueRuns = fatigue > 0 ? Math.ceil(fatigue / 8) : 0;
    const runs = Math.min(fatigueRuns, tickets + Math.floor(totalRev / cost));

    // 1) 보유 계시로 입장
    const revRuns = Math.min(runs, Math.floor(rev / cost));
    // 2) 입장권으로 입장
    const ticketRuns = Math.min(runs - revRuns, tickets);
    // 3) 나머지는 계시를 모아서 입장
    let need = (runs - revRuns - ticketRuns) * cost;

    // 보유 계시 사용량 (입장 분 + 남은 낱개)
    const revUsed = revRuns * cost + Math.min(rev - revRuns * cost, need);
    need -= Math.min(rev - revRuns * cost, need);

    // [Event] 계시
    const stockUsed = Math.min(eventStock, need);
    need -= stockUsed;

    // 상자/구슬: 큰 것부터 필요량 안에서 최대한 사용
    const boxUsed = {};
    BOX_TYPES.forEach(b => {
        const k = Math.min(boxCounts[b.id], Math.floor(need / b.amount));
        boxUsed[b.id] = k;
        need -= k * b.amount;
    });
    // 남은 부족분은 초과량이 가장 적은 상자로 채움
    let overshoot = 0;
    while (need > 0) {
        const avail = BOX_TYPES.filter(b => boxCounts[b.id] - boxUsed[b.id] > 0);
        if (avail.length === 0) break;
        const enough = avail.filter(b => b.amount >= need);
        const pick = enough.length
            ? enough.reduce((a, b) => (b.amount < a.amount ? b : a))
            : avail[0]; // avail은 큰 순서 → 가장 큰 상자
        boxUsed[pick.id] += 1;
        need -= pick.amount;
    }
    if (need < 0) overshoot = -need;

    // 계정귀속 계시: 상자/구슬을 다 쓰고도 부족할 때만 사용
    const eventUsed = Math.min(eventRev, Math.max(0, need));
    need -= eventUsed;

    const missingRev = Math.max(0, (fatigueRuns - tickets) * cost - totalRev);

    return {
        fatigue, rev, cost, totalRev, fatigueRuns, runs,
        revUsed, ticketRuns, eventUsed, stockUsed, boxUsed, overshoot, missingRev
    };
}

function calculate() {
    const p = computePlan();
    lastPlan = p;
    saveStock();

    document.getElementById('costPerRun').innerText = p.cost;
    document.getElementById('totalRevSum').innerText = fmt(p.totalRev);
    document.getElementById('fatigueRuns').innerText = p.fatigueRuns;
    document.getElementById('actualRuns').innerText = p.runs;

    const missingInfoEl = document.getElementById('missingInfo');
    if (p.missingRev > 0) {
        missingInfoEl.innerHTML = `부족한 종말의 계시: <span class="alert">${fmt(p.missingRev)}개</span>`;
    } else if (p.fatigueRuns > 0) {
        missingInfoEl.innerHTML = `<span class="highlight">피로도를 모두 소진할 수 있습니다!</span>`;
    } else {
        missingInfoEl.innerHTML = `피로도를 입력해주세요.`;
    }

    // 사용 계획 렌더링
    const rows = [];
    if (p.revUsed > 0) rows.push(['보유 종말의 계시', `${fmt(p.revUsed)}개`]);
    if (p.ticketRuns > 0) rows.push(['보유 입장권', `${fmt(p.ticketRuns)}장`]);
    if (p.stockUsed > 0) rows.push(['[Event]종말의 계시', `${fmt(p.stockUsed)}개`]);
    BOX_TYPES.forEach(b => {
        if (p.boxUsed[b.id] > 0) rows.push([`종말의 계시 ${b.name}`, `${fmt(p.boxUsed[b.id])}개`]);
    });
    if (p.eventUsed > 0) rows.push(['계정귀속 종말의 계시', `${fmt(p.eventUsed)}개`]);

    document.getElementById('planList').innerHTML = rows
        .map(r => `<li><span>${r[0]}</span><span class="highlight">${r[1]}</span></li>`)
        .join('');

    const emptyEl = document.getElementById('planEmpty');
    if (rows.length === 0) {
        emptyEl.style.display = '';
        emptyEl.innerText = p.fatigueRuns > 0 ? '사용 가능한 재료가 없습니다.' : '피로도를 입력해주세요.';
    } else {
        emptyEl.style.display = 'none';
    }

    const afterEl = document.getElementById('planAfter');
    if (rows.length > 0) {
        const remain = p.rev - p.revUsed + p.overshoot;
        afterEl.innerHTML = `사용 후 보유 종말의 계시: <span class="highlight">${fmt(remain)}개</span>`
            + ` / 남는 피로도: <span class="highlight">${fmt(Math.max(0, p.fatigue - p.runs * 8))}</span>`;
    } else {
        afterEl.innerHTML = '';
    }

    document.getElementById('useBtn').disabled = p.runs <= 0;
}

function snapshot() {
    const s = {};
    ALL_IDS.forEach(id => { s[id] = document.getElementById(id).value; });
    return s;
}

// 사용 버튼: 계획대로 입력된 보유량에서 차감
function useResources() {
    const p = lastPlan;
    if (!p || p.runs <= 0) return;

    undoSnapshot = snapshot();

    const set = (id, n) => { document.getElementById(id).value = String(Math.max(0, n)); };

    set('tickets', val('tickets') - p.ticketRuns);
    set('eventRevelations', val('eventRevelations') - p.eventUsed);
    set('eventStock', val('eventStock') - p.stockUsed);
    BOX_TYPES.forEach(b => set(b.id, val(b.id) - p.boxUsed[b.id]));
    // 상자에서 나온 남는 계시는 캐릭터의 보유 종말의 계시로 남음
    set('revelations', p.rev - p.revUsed + p.overshoot);
    set('fatigue', p.fatigue - p.runs * 8);

    document.getElementById('undoBtn').disabled = false;
    calculate();
}

function undoUse() {
    if (!undoSnapshot) return;
    ALL_IDS.forEach(id => { document.getElementById(id).value = undoSnapshot[id]; });
    undoSnapshot = null;
    document.getElementById('undoBtn').disabled = true;
    calculate();
}

// 초기 로드: 저장된 수량 복원 후 계산
loadStock();
calculate();
</script>
